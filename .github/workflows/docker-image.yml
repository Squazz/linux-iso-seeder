name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*", "[0-9]+.*" ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitattributes"
      - ".gitignore"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitattributes"
      - ".gitignore"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"

    - name: Install test dependencies
      run: pip install -r requirements-test.txt

    - name: Run tests
      run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push latest image for main branch
      if: github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ghcr.io/squazz/linux-iso-seeder:latest
        build-args: |
          VERSION=latest

    - name: Extract version from tag
      if: startsWith(github.ref, 'refs/tags/')
      id: extract_version
      run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

    - name: Build and push versioned image for tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ghcr.io/squazz/linux-iso-seeder:${{ steps.extract_version.outputs.version }}
          ghcr.io/squazz/linux-iso-seeder:latest
        build-args: |
          VERSION=${{ steps.extract_version.outputs.version }}

    - name: Create GitHub release if one doesn't already exist for this tag
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        fi
