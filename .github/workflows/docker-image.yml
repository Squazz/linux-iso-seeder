name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*", "[0-9]+.*" ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitattributes"
      - ".gitignore"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "!.github/workflows/docker-image.yml"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitattributes"
      - ".gitignore"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "!.github/workflows/docker-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"

    - name: Install dev dependencies
      run: pip install -r requirements-dev.txt

    - name: Lint
      run: ruff check .

    - name: Check formatting
      run: ruff format --check .

    - name: Type-check
      run: mypy

    - name: Run tests
      run: coverage run -m unittest discover -s tests -v

    # Report only for now; settings (branch coverage, which modules) are in
    # pyproject.toml.
    - name: Coverage report
      run: coverage report

    # Same suite again with env vars exported that would flip outcomes if any
    # test leaked the developer's shell environment into production code.
    - name: Run tests with a hostile environment
      run: python -m unittest discover -s tests
      env:
        SKIP_RATIO_CHECK: "true"
        CLEANUP_MIN_RATIO: "5"
        CLEANUP_SKIP_RATIO_CHECK: "true"
        TRANSMISSION_RPC_USERNAME: x
        TRANSMISSION_RPC_PASSWORD: y
        FETCH_TORRENTS_DISTROS: arch
        FETCH_TORRENTS_LOG_MAX_BYTES: "7"
        FETCH_TORRENTS_ALWAYS_LOG: "false"

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v7

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push latest image for main branch
      if: github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ghcr.io/squazz/linux-iso-seeder:latest
        build-args: |
          VERSION=latest

    - name: Extract version from tag
      if: startsWith(github.ref, 'refs/tags/')
      id: extract_version
      run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

    - name: Build and push versioned image for tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ghcr.io/squazz/linux-iso-seeder:${{ steps.extract_version.outputs.version }}
          ghcr.io/squazz/linux-iso-seeder:latest
        build-args: |
          VERSION=${{ steps.extract_version.outputs.version }}

    - name: Create GitHub release if one doesn't already exist for this tag
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        fi
