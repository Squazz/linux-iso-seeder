name: Release on Tag

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'

permissions:
  contents: read
  packages: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Create GitHub release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          context: .
          file: Dockerfile
          push: true
          body: |
            Release ${{ github.ref_name }} published automatically by GitHub Actions.
          draft: false
          prerelease: false
          tags: ghcr.io/squazz/linux-iso-seeder:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
